<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ post.title }} - Linkversity Blog</title>
    <meta name="description" content="{{ post.description }}">
    <meta name="keywords" content="{{ post.keywords }}">
    <meta name="author" content="{{ post.author }}">
    <link rel="icon" href="{{url_for('static', filename='linkversity.png')}}">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.2/css/all.min.css">
    <style>
        .prose h1 { font-size: 2.25rem; font-weight: 700; margin-bottom: 1rem; }
        .prose h2 { font-size: 1.875rem; font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.75rem; }
        .prose h3 { font-size: 1.5rem; font-weight: 600; margin-top: 1.25rem; margin-bottom: 0.5rem; }
        .prose p { margin-bottom: 1rem; }
        .prose ul, .prose ol { margin-bottom: 1rem; padding-left: 1.5rem; }
        .prose li { margin-bottom: 0.25rem; }
        .prose code { background: #f3f4f6; padding: 0.125rem 0.375rem; border-radius: 0.25rem; font-size: 0.875rem; }
        .prose pre { background: #1f2937; color: #f9fafb; padding: 1rem; border-radius: 0.5rem; overflow-x: auto; margin-bottom: 1rem; }
        .prose pre code { background: transparent; padding: 0; }
        .prose blockquote { border-left: 4px solid #d1d5db; padding-left: 1rem; font-style: italic; margin-bottom: 1rem; }
        .prose a { color: #2563eb; text-decoration: underline; }
    </style>
</head>
<body class="bg-gray-50">
    <nav class="bg-white border-b border-gray-200">
        <div class="max-w-screen-xl mx-auto px-4 py-4 flex justify-between items-center">
            <a href="/" class="flex items-center">
                <img src="{{url_for('static', filename='linkversity.png')}}" class="h-10">
                <span class="ml-2 text-xl font-bold text-gray-800">Linkversity</span>
            </a>
            <div class="flex space-x-6">
                <a href="/" class="text-gray-600 hover:text-gray-900">Home</a>
                <a href="/blog" class="text-gray-900 font-semibold">Blog</a>
            </div>
        </div>
    </nav>

    <main class="max-w-screen-xl mx-auto px-4 py-12">
        <article class="max-w-3xl mx-auto">
            <header class="mb-8">
                <a href="/blog" class="text-blue-600 hover:text-blue-800 mb-4 inline-block">&larr; Back to Blog</a>
                <h1 class="text-4xl font-bold text-gray-900 mt-4 mb-2">{{ post.title }}</h1>
                <div class="text-gray-500">
                    <span>{{ post.date }}</span>
                    {% if post.author %}
                    <span class="mx-2">|</span>
                    <span>By {{ post.author }}</span>
                    {% endif %}
                </div>
            </header>
            
            <div class="prose prose-lg max-w-none">
                {{ post.content|safe }}
            </div>
        </article>
    </main>

    <footer class="bg-gray-900 text-white py-8 mt-12">
        <div class="max-w-screen-xl mx-auto px-4 text-center">
            <p>&copy; 2024 Linkversity. All rights reserved.</p>
        </div>
    </footer>
</body>
</html>
