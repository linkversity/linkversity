<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    body {
      width: 300px;
      padding: 15px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .container {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    h2 {
      margin: 0 0 10px 0;
      font-size: 18px;
      color: #333;
    }
    select, button {
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #ccc;
      font-size: 14px;
    }
    button {
      background-color: #ff8080;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }
    button:hover {
      background-color: #ff6666;
    }
    button:disabled {
      background-color: #ccc;
    }
    .hidden {
      display: none;
    }
    #login-section {
      text-align: center;
      padding: 20px 0;
    }
    .status {
      font-size: 12px;
      margin-top: 5px;
    }
    .success { color: green; }
    .error { color: red; }
  </style>
</head>
<body>
  <div class="container">
    <h2>Linkversity</h2>
    
    <div id="login-section">
      <p>Please log in to start saving links.</p>
      <button id="login-btn">Log in with Linkversity</button>
    </div>

    <div id="save-section" class="hidden">
      <div id="tab-info">
        <p id="current-url" style="font-size: 12px; color: #666; word-break: break-all;"></p>
      </div>

      <label for="path-select">Choose Path:</label>
      <select id="path-select">
        <option value="">Loading paths...</option>
      </select>

      <label for="section-select">Choose Section:</label>
      <select id="section-select" disabled>
        <option value="">Select a path first</option>
      </select>

      <button id="save-btn" disabled>Save Link</button>
      <div id="status-msg" class="status"></div>
      
      <hr style="margin: 10px 0; border: 0; border-top: 1px solid #eee;">
      <button id="logout-btn" style="background: none; color: #999; font-size: 11px; font-weight: normal; padding: 0;">Logout</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
