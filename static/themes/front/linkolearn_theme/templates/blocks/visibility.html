{% macro vis_switch(path) %}
<button type="button" class="vis-switch {{ 'on' if path.is_visible }}" role="switch"
        aria-checked="{{ 'true' if path.is_visible else 'false' }}"
        onclick="lvToggleVis({{ path.id }}, this)"
        title="{{ 'Public | anyone with the link can view' if path.is_visible else 'Private | only you and people you share with can view' }}">
    <span class="track"></span>
    <i class="fa {{ 'fa-globe' if path.is_visible else 'fa-lock' }}"></i>
    <span class="vis-label">{{ 'Public' if path.is_visible else 'Private' }}</span>
</button>
<script>
window.lvToggleVis = window.lvToggleVis || async function(pathId, btn) {
    const on = btn.classList.contains('on');
    try {
        const resp = await fetch("{{ url_for('linkolearn.set_visibility') }}", {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': '{{ csrf_token() }}'
            },
            body: JSON.stringify({ path_id: pathId, visible: !on })
        });
        const data = await resp.json();
        if (!data.success) {
            alert(data.error || 'Could not update visibility');
            return;
        }
        btn.classList.toggle('on', data.is_visible);
        btn.setAttribute('aria-checked', String(data.is_visible));
        btn.querySelector('.vis-label').textContent = data.is_visible ? 'Public' : 'Private';
        btn.querySelector('i').className = 'fa ' + (data.is_visible ? 'fa-globe' : 'fa-lock');
        btn.title = data.is_visible
            ? 'Public | anyone with the link can view'
            : 'Private | only you and people you share with can view';
    } catch (e) {
        alert('Could not update visibility');
    }
};
</script>
{% endmacro %}
