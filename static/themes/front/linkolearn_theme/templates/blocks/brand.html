<style>
    .relative { position: relative; }

    /* ---------- Airbnb-inspired tokens ---------- */
    .lv-scope, body {
        --lv-coral: #FF385C;
        --lv-coral-dark: #E01A45;
        --lv-coral-tint: #FFF0F3;
        --lv-ink: #222222;
        --lv-muted: #6A6A6A;
        --lv-line: #EBEBEB;
        --lv-line-strong: #DDDDDD;
    }

    .path-card {
        background: #fff;
        border: 1px solid #EBEBEB;
        border-radius: 16px;
        padding: 22px;
        box-shadow: 0 6px 20px rgba(0,0,0,.06), 0 1px 2px rgba(0,0,0,.04);
    }
    .path-pill {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        border: 1px solid #DDDDDD;
        background: #fff;
        color: #222222;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12px;
        font-weight: 600;
        font-family: inherit;
        cursor: pointer;
        transition: border-color .15s ease, background .15s ease, color .15s ease, box-shadow .15s ease;
        white-space: nowrap;
    }
    .path-pill:hover { border-color: #CFCFCF; background: #F7F7F7; }
    .path-pill.on {
        border-color: #FF385C;
        background: #FFF0F3;
        color: #B01E44;
    }
    .path-pill.gold.on {
        border-color: #e6b800;
        background: #fffae6;
        color: #8a6d00;
    }
    .path-pill.danger:hover { border-color: #fca5a5; background: #fef2f2; color: #b91c1c; }
    .path-pill .count { font-variant-numeric: tabular-nums; }

    .path-btn-primary {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #FF385C;
        color: #fff;
        border: 1px solid transparent;
        border-radius: 999px;
        padding: 8px 16px;
        font-size: 12.5px;
        font-weight: 700;
        font-family: inherit;
        cursor: pointer;
        box-shadow: 0 6px 16px rgba(255,56,92,.28);
        transition: background .15s ease, transform .06s ease, box-shadow .15s ease;
        white-space: nowrap;
    }
    .path-btn-primary:hover { background: #E01A45; }
    .path-btn-primary:active { transform: translateY(1px); }
    .path-btn-primary:disabled { opacity: .6; cursor: not-allowed; }

    .path-tool {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        border: 1px solid #EBEBEB;
        background: #fff;
        color: #6A6A6A;
        font-size: 11px;
        cursor: pointer;
        transition: color .15s ease, border-color .15s ease, background .15s ease;
    }
    .path-tool:hover { color: #B01E44; border-color: #FFD2DC; background: #FFF0F3; }

    .path-input {
        width: 100%;
        border: 1px solid #DDDDDD;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 14px;
        font-family: inherit;
        background: #fff;
        color: #222222;
        transition: border-color .15s ease, box-shadow .15s ease;
    }
    .path-input::placeholder { color: #9A9A9A; }
    .path-input:focus {
        outline: none;
        border-color: #222222;
        box-shadow: 0 0 0 3px rgba(34,34,34,.08);
    }

    .path-num {
        flex: 0 0 22px;
        width: 22px;
        height: 22px;
        border-radius: 50%;
        background: #F7F7F7;
        border: 1px solid #EBEBEB;
        color: #6A6A6A;
        font-size: 11px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 1px;
    }

    .path-link {
        font-size: 13.5px;
        font-weight: 600;
        color: #222222;
        text-decoration: none;
        border-bottom: 1px solid transparent;
        transition: color .15s ease, border-color .15s ease;
    }
    .path-link:hover { color: #E01A45; border-bottom-color: #FFD2DC; }

    .path-preview {
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid #EBEBEB;
        border-radius: 14px;
        overflow: hidden;
        transition: box-shadow .2s ease, transform .2s ease, border-color .2s ease;
    }
    .path-preview:hover {
        transform: translateY(-2px);
        border-color: #DDDDDD;
        box-shadow: 0 12px 28px -16px rgba(0,0,0,.35);
    }

    .path-chip {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        background: #F7F7F7;
        border: 1px solid #EBEBEB;
        border-radius: 999px;
        padding: 3px 10px 3px 3px;
        font-size: 12px;
        font-weight: 600;
        color: #222222;
    }

    .crown {
        position: absolute;
        top: -14px;
        right: -10px;
        transform: rotate(12deg);
        filter: drop-shadow(0 1px 1px rgba(17, 24, 39, .3));
    }

    .ent-badge {
        position: absolute;
        top: -13px;
        right: -11px;
        transform: rotate(-8deg);
        filter: drop-shadow(0 1px 1px rgba(17, 24, 39, .3));
    }

    .vis-switch {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 5px 12px 5px 6px;
        border: 1px solid #DDDDDD;
        background: #fff;
        color: #6A6A6A;
        border-radius: 999px;
        font-size: 12px;
        font-weight: 600;
        cursor: pointer;
        transition: background .15s ease, border-color .15s ease, color .15s ease;
    }
    .vis-switch:hover { border-color: #CFCFCF; }
    .vis-switch .track {
        position: relative;
        width: 30px;
        height: 17px;
        flex: none;
        border-radius: 999px;
        background: #DDDDDD;
        transition: background .15s ease;
    }
    .vis-switch .track::after {
        content: '';
        position: absolute;
        top: 2px;
        left: 2px;
        width: 13px;
        height: 13px;
        border-radius: 50%;
        background: #fff;
        box-shadow: 0 1px 2px rgba(17, 24, 39, .25);
        transition: transform .15s ease;
    }
    .vis-switch.on {
        border-color: #bbf7d0;
        background: #f0fdf4;
        color: #15803d;
    }
    .vis-switch.on .track { background: #22c55e; }
    .vis-switch.on .track::after { transform: translateX(13px); }

    @media (prefers-color-scheme: dark) {
        .vis-switch { background: #16191e; border-color: #262b36; color: #9ca3af; }
        .vis-switch:hover { border-color: #4b3436; }
        .vis-switch .track { background: #374151; }
        .vis-switch.on { border-color: #14532d; background: #0c1f14; color: #4ade80; }
        .vis-switch.on .track { background: #16a34a; }
        .path-card { background: #111318; border-color: #1f2430; box-shadow: none; }
        .path-pill { background: #16191e; border-color: #262b36; color: #d1d5db; }
        .path-pill:hover { background: #1c2027; border-color: #4b3436; }
        .path-pill.on { background: #2a1b1c; border-color: #FF385C; color: #ff9d9d; }
        .path-pill.gold.on { background: #241f0d; border-color: #e6b800; color: #ffd85e; }
        .path-btn-primary { background: #E01A45; box-shadow: none; }
        .path-btn-primary:hover { background: #FF385C; }
        .path-tool { background: #16191e; border-color: #262b36; color: #9ca3af; }
        .path-tool:hover { color: #ff9d9d; border-color: #4b3436; background: #2a1b1c; }
        .path-input { background: #0e1013; border-color: #262b36; color: #f3f4f6; }
        .path-input:focus { border-color: #FF385C; box-shadow: 0 0 0 3px rgba(255,56,92,.18); }
        .path-num { background: #16191e; border-color: #262b36; color: #9ca3af; }
        .path-link { color: #e5e7eb; }
        .path-link:hover { color: #ff9d9d; border-bottom-color: #4b3436; }
        .path-preview { background: #16191e; border-color: #262b36; }
        .path-chip { background: #16191e; border-color: #262b36; color: #d1d5db; }
    }

    /* ---- shared page furniture ---- */
    .path-label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        color: #6A6A6A;
        margin-bottom: 6px;
    }

    .path-stat {
        display: inline-flex;
        align-items: center;
        gap: 7px;
        background: #F7F7F7;
        border: 1px solid #EBEBEB;
        border-radius: 999px;
        padding: 6px 12px;
        font-size: 12.5px;
        font-weight: 600;
        color: #222222;
    }
    .path-stat i { color: #9A9A9A; }
    .path-stat .count { font-variant-numeric: tabular-nums; }

    .path-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        color: #6A6A6A;
        font-size: 11.5px;
        font-weight: 600;
    }

    a.path-link-card, .path-link-card {
        display: block;
        background: #fff;
        border: 1px solid #EBEBEB;
        border-radius: 14px;
        padding: 16px;
        text-decoration: none;
        box-shadow: 0 1px 2px rgba(0,0,0,.04);
        transition: border-color .15s ease, box-shadow .15s ease, transform .15s ease;
    }
    .path-link-card:hover, div.path-link-card:hover {
        border-color: #DDDDDD;
        transform: translateY(-2px);
        box-shadow: 0 12px 28px -16px rgba(0,0,0,.35);
    }
    .path-link-card .title {
        font-size: 14.5px;
        font-weight: 700;
        color: #222222;
        line-height: 1.3;
    }
    .path-link-card .sub {
        font-size: 12px;
        color: #6A6A6A;
        margin-top: 2px;
    }
    .path-link-card .badges {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 9px;
    }

    .path-empty {
        text-align: center;
        padding: 48px 20px;
        color: #6A6A6A;
    }
    .path-empty .glyph {
        width: 48px;
        height: 48px;
        margin: 0 auto 12px;
        border-radius: 50%;
        background: #F7F7F7;
        border: 1px solid #EBEBEB;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #9A9A9A;
        font-size: 18px;
    }
    .path-empty h3 {
        font-size: 15px;
        font-weight: 700;
        color: #222222;
        margin-bottom: 4px;
    }
    .path-empty p { font-size: 13px; }

    textarea.path-input { resize: vertical; min-height: 90px; }

    /* ---- path profile cover band (same identity as the landing card) ---- */
    .path-cover {
        position: relative;
        height: 132px;
        margin: -22px -22px 28px;   /* bleed to card edges; extra bottom room
                                       so the hanging glyph clears the nav */
        border-radius: 15px 15px 0 0;
        /* NOT overflow:hidden - the glyph deliberately hangs past the band.
           border-radius still clips the gradient background itself, and the
           oversized monogram is contained by its own .mono-clip wrapper. */
    }
    .path-cover .mono-clip {
        position: absolute;
        inset: 0;
        overflow: hidden;
        border-radius: 15px 15px 0 0;
        pointer-events: none;
    }
    .path-cover .mono {
        position: absolute;
        right: 14px;
        bottom: -30px;
        font-size: 118px;
        font-weight: 800;
        line-height: 1;
        color: rgba(255,255,255,.22);
        user-select: none;
    }
    .path-cover .glyph {
        position: absolute;
        left: 20px;
        bottom: -20px;
        z-index: 2;
        width: 48px;
        height: 48px;
        border-radius: 14px;
        background: rgba(255,255,255,.92);
        display: grid;
        place-items: center;
        font-size: 19px;
        color: #222222;
        box-shadow: 0 6px 16px rgba(0,0,0,.2);
    }
    .path-cover .count-pill {
        position: absolute;
        top: 12px;
        right: 12px;
        display: inline-flex;
        align-items: center;
        gap: 5px;
        background: rgba(0,0,0,.28);
        backdrop-filter: blur(4px);
        color: #fff;
        border-radius: 999px;
        padding: 4px 10px;
        font-size: 11.5px;
        font-weight: 700;
    }
    .path-cover .lock-pill {
        position: absolute;
        top: 12px;
        left: 12px;
        width: 26px;
        height: 26px;
        border-radius: 8px;
        background: rgba(0,0,0,.28);
        backdrop-filter: blur(4px);
        color: #fff;
        display: grid;
        place-items: center;
        font-size: 11px;
    }
    @media (prefers-color-scheme: dark) {
        .path-cover .glyph { background: rgba(30,33,40,.92); color: #e5e7eb; }
    }

    @media (prefers-color-scheme: dark) {
        .path-label { color: #9ca3af; }
        .path-stat { background: #16191e; border-color: #262b36; color: #d1d5db; }
        .path-stat i { color: #6b7280; }
        .path-badge { color: #9ca3af; }
        a.path-link-card, .path-link-card { background: #16191e; border-color: #262b36; box-shadow: none; }
        .path-link-card:hover, div.path-link-card:hover { border-color: #4b3436; transform: none; }
        .path-link-card .title { color: #f3f4f6; }
        .path-link-card .sub { color: #9ca3af; }
        .path-empty { color: #9ca3af; }
        .path-empty .glyph { background: #16191e; border-color: #262b36; color: #6b7280; }
        .path-empty h3 { color: #f3f4f6; }
        textarea.path-input, .path-input { background: #0e1013; border-color: #262b36; color: #f3f4f6; }
    }
</style>
